plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kpkeshav.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.kpkeshav.player"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.0-android"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
